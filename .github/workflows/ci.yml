# Runs on every push to main and every pull request. The release workflow
# (release.yml) is separate and only fires on tags.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  rust:
    # macOS has no extra system dependencies for a Tauri build; Linux
    # would need webkit2gtk and friends. Windows only gets a `cargo check`
    # (see matrix.cargo below) since we don't ship a Windows-specific
    # sidecar layout to exercise here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cargo: "test --locked"
          - os: windows-latest
            cargo: "check --all-targets --locked"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install frontend deps
        working-directory: tauri-app
        run: bun install --frozen-lockfile
      - name: Build frontend (tauri::generate_context! embeds ../dist)
        working-directory: tauri-app
        run: bun run build
      - name: Cache uv sidecar
        uses: actions/cache@v4
        with:
          path: tauri-app/src-tauri/binaries/uv-*
          key: uv-${{ runner.os }}-${{ hashFiles('tauri-app/src-tauri/binaries/download-uv.sh') }}
      - name: Download uv sidecar (tauri-build requires externalBin to exist)
        shell: bash
        run: bash tauri-app/src-tauri/binaries/download-uv.sh
      - name: Test / check
        working-directory: tauri-app/src-tauri
        run: cargo ${{ matrix.cargo }}
      - name: Clippy
        if: runner.os == 'macOS'
        working-directory: tauri-app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Embedded baseline matches marketplace-catalog/catalog.json
        shell: bash
        run: |
          if ! diff -u <(jq -S . marketplace-catalog/catalog.json) \
                       <(jq -S . tauri-app/src-tauri/resources/catalog-baseline.json); then
            echo "::error::Embedded catalog baseline is out of sync. Run scripts/sync-catalog-baseline.sh and commit."
            exit 1
          fi
